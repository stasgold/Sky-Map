name: App Store screenshots

# Runs the real app in the iOS Simulator and captures App Store screenshots by driving its
# real screens with the StellarNavigatorUITests UI-test bundle (never part of the shipped app),
# then adds a caption header above each one (tools/frame_screenshots.py).
# The location is chosen at run time so that it is late evening there, so the sky shown is the
# genuine current sky at that place. Results: the "screenshots" artifact and the
# app-store-screenshots branch.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26 or later
        run: |
          XCODE=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | grep -v -i beta | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Pick simulators and a late-evening location
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json, subprocess, datetime, re
          devs = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))["devices"]
          def best(pattern):
              found = []
              for runtime, items in devs.items():
                  m = re.search(r"iOS-(\d+)-(\d+)", runtime)
                  if not m:
                      continue
                  for d in items:
                      if re.fullmatch(pattern, d["name"]):
                          found.append(((int(m.group(1)), int(m.group(2))), d["name"], d["udid"]))
              found.sort()
              return found[-1]
          phone = best(r"iPhone \d+ Pro Max")
          pad = best(r"iPad Pro 13-inch.*")
          now = datetime.datetime.now(datetime.timezone.utc)
          utc_hours = now.hour + now.minute / 60
          lon = ((22.5 - utc_hours) * 15 + 180) % 360 - 180   # local mean time ≈ 22:30
          print(f"PHONE_UDID={phone[2]}\nPHONE_NAME={phone[1]}\nPAD_UDID={pad[2]}\nPAD_NAME={pad[1]}")
          print(f"SHOT_LAT=38.0\nSHOT_LON={lon:.3f}")
          PY
          cat "$GITHUB_ENV" | tail -6

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project StellarNavigator.xcodeproj -scheme StellarNavigator \
            -destination "id=$PHONE_UDID" -destination "id=$PAD_UDID" \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO

      - name: Capture
        run: |
          set -o pipefail
          mkdir -p shots
          for pair in "$PHONE_UDID:iphone-6.9" "$PAD_UDID:ipad-13"; do
            udid=${pair%%:*}; label=${pair#*:}
            xcrun simctl boot "$udid" || true
            xcrun simctl bootstatus "$udid" -b
            xcrun simctl status_bar "$udid" override --time "9:41" --batteryState charged \
              --batteryLevel 100 --wifiBars 3 --cellularMode active --cellularBars 4 --dataNetwork wifi || true
            xcrun simctl location "$udid" set "$SHOT_LAT,$SHOT_LON"
            xcrun simctl privacy "$udid" grant location io.github.stasgold.skyatlas || true
            # Simulators on CI occasionally time out launching the app; retry once if a run
            # captured nothing.
            for attempt in 1 2; do
              rm -rf "$RUNNER_TEMP/$label.xcresult" "$RUNNER_TEMP/att-$label"
              xcodebuild test-without-building \
                -project StellarNavigator.xcodeproj -scheme StellarNavigator \
                -destination "id=$udid" -derivedDataPath "$RUNNER_TEMP/dd" \
                -only-testing:StellarNavigatorUITests \
                -resultBundlePath "$RUNNER_TEMP/$label.xcresult" || true
              xcrun xcresulttool export attachments --path "$RUNNER_TEMP/$label.xcresult" \
                --output-path "$RUNNER_TEMP/att-$label" || true
              # Every screen must be there; otherwise retry the device once.
              n=$(grep -oE '"suggestedHumanReadableName" *: *"0[1-8]-' "$RUNNER_TEMP/att-$label/manifest.json" 2>/dev/null | sort -u | wc -l)
              [ "$n" -ge 8 ] && break
              echo "Only $n of 8 screens on attempt $attempt for $label; rebooting the simulator and retrying."
              xcrun simctl shutdown "$udid" || true
              xcrun simctl boot "$udid" || true
              xcrun simctl bootstatus "$udid" -b
              xcrun simctl location "$udid" set "$SHOT_LAT,$SHOT_LON"
            done
            python3 - "$RUNNER_TEMP/att-$label" "raw/$label" <<'PY'
          import json, pathlib, shutil, sys
          src, dst = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          dst.mkdir(parents=True, exist_ok=True)
          for test in json.loads((src / "manifest.json").read_text()):
              for a in test.get("attachments", []):
                  name = a.get("suggestedHumanReadableName", "")
                  if name[:2].isdigit():   # our screenshots only, not XCTest's debug captures
                      shutil.copy(src / a["exportedFileName"], dst / (name.split("_")[0] + ".png"))
          print(sorted(p.name for p in dst.iterdir()))
          PY
            # Crash reports from the app, if it died during the run.
            mkdir -p "shots/crash-reports-$label"
            find ~/Library/Logs/DiagnosticReports -name 'StellarNavigator*' -newer "$RUNNER_TEMP/dd" \
              -exec cp {} "shots/crash-reports-$label/" \; 2>/dev/null || true
            for f in "shots/crash-reports-$label"/*; do [ -f "$f" ] && { echo "=== $f"; head -c 6000 "$f"; echo; }; done
            xcrun simctl shutdown "$udid" || true
          done
          # Caption headers over the real screenshots (tools/frame_screenshots.py), at the same size.
          python3 -m pip install --quiet --break-system-packages pillow
          python3 tools/frame_screenshots.py raw shots
          mkdir -p shots/raw && cp -R raw/* shots/raw/
          sips -g pixelWidth -g pixelHeight shots/*/*.png | paste - - - | awk '{print $1, $3"x"$5}' || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots

      - name: Publish to the app-store-screenshots branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp -R shots "$RUNNER_TEMP/shots"
          git checkout --orphan app-store-screenshots
          git rm -rq --cached . && git clean -fdq
          cp -R "$RUNNER_TEMP/shots"/* .
          printf "# App Store screenshots\n\nCaptured from the real app in the iOS Simulator by the\nApp Store screenshots workflow at lat %s, lon %s (late evening local time).\n\niphone-6.9/ and ipad-13/ have caption headers (these are uploaded); raw/ has the plain captures.\n" "$SHOT_LAT" "$SHOT_LON" > README.md
          git add -A
          git commit -qm "App Store screenshots"
          git push -f origin app-store-screenshots
