name: TestFlight

# Archives, signs (Xcode cloud-managed automatic signing) and uploads a build to App Store
# Connect, where it appears in TestFlight after processing. Run it from the Actions tab.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID                 10-character Team ID (developer.apple.com → Membership)
#   APP_STORE_CONNECT_KEY_ID      API key ID (App Store Connect → Users and Access → Integrations)
#   APP_STORE_CONNECT_ISSUER_ID   Issuer ID shown above the keys list
#   APP_STORE_CONNECT_KEY         full contents of the downloaded AuthKey_XXXX.p8 file
# The key needs the Admin role so Xcode can create the distribution certificate and profile.

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-15
    env:
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          missing=0
          for v in KEY_ID ISSUER_ID TEAM_ID; do
            if [ -z "${!v}" ]; then echo "::error::Secret for $v is not set"; missing=1; fi
          done
          if [ -z "${{ secrets.APP_STORE_CONNECT_KEY }}" ]; then echo "::error::APP_STORE_CONNECT_KEY is not set"; missing=1; fi
          exit $missing

      - name: Install API key
        env:
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          mkdir -p ~/private_keys
          # Rebuild a clean PEM whatever form the secret was pasted in: with or without the
          # BEGIN/END lines, Windows line endings, line breaks lost (one long line, or spaces
          # instead of newlines), or the whole .p8 file base64-encoded once more.
          python3 - "$HOME/private_keys/AuthKey_$KEY_ID.p8" <<'PY'
          import base64, os, re, sys
          raw = os.environ["KEY_P8"].replace("\r", "")
          body = re.sub(r"-----(BEGIN|END)[A-Z ]*-----", "", raw)
          body = re.sub(r"[^A-Za-z0-9+/=]", "", body)
          try:
              decoded = base64.b64decode(body + "=" * (-len(body) % 4))
          except Exception:
              decoded = b""
          if b"PRIVATE KEY" in decoded:
              # The secret was a base64-encoded .p8 file; use what it contained.
              text = decoded.decode("utf-8", "replace")
              body = re.sub(r"-----(BEGIN|END)[A-Z ]*-----", "", text)
              body = re.sub(r"[^A-Za-z0-9+/=]", "", body)
              decoded = base64.b64decode(body + "=" * (-len(body) % 4))
          lines = [body[i:i + 64] for i in range(0, len(body), 64)]
          pem = "-----BEGIN PRIVATE KEY-----\n" + "\n".join(lines) + "\n-----END PRIVATE KEY-----\n"
          open(sys.argv[1], "w").write(pem)
          # Non-secret diagnostics: an App Store Connect EC P-256 key is ~138 bytes of DER.
          print(f"Key body: {len(body)} base64 chars, {len(decoded)} DER bytes, starts with SEQUENCE: {decoded[:1] == b'0'}")
          if len(decoded) < 100 or decoded[:1] != b"0":
              print("::error::APP_STORE_CONNECT_KEY does not look like an App Store Connect .p8 private key. "
                    "Paste the entire AuthKey_XXXX.p8 file contents.")
              sys.exit(1)
          PY
          echo "KEY_PATH=$HOME/private_keys/AuthKey_$KEY_ID.p8" >> "$GITHUB_ENV"

      - name: Archive
        run: |
          set -o pipefail
          # Each run gets a fresh, increasing build number; App Store Connect rejects repeats.
          BUILD_NUMBER=$(( ${{ github.run_number }} + 1 ))
          xcodebuild archive \
            -project StellarNavigator.xcodeproj \
            -scheme StellarNavigator \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/StellarNavigator.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Upload to App Store Connect
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/StellarNavigator.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Clean up key
        if: always()
        run: rm -rf ~/private_keys
