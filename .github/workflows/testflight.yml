name: TestFlight

# Archives, signs (Xcode cloud-managed automatic signing) and uploads a build to App Store
# Connect, where it appears in TestFlight after processing. Run it from the Actions tab.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID                 10-character Team ID (developer.apple.com → Membership)
#   APP_STORE_CONNECT_KEY_ID      API key ID (App Store Connect → Users and Access → Integrations)
#   APP_STORE_CONNECT_ISSUER_ID   Issuer ID shown above the keys list
#   APP_STORE_CONNECT_KEY         full contents of the downloaded AuthKey_XXXX.p8 file
# The key needs the Admin role so Xcode can create the distribution certificate and profile.

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-15
    env:
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          missing=0
          for v in KEY_ID ISSUER_ID TEAM_ID; do
            if [ -z "${!v}" ]; then echo "::error::Secret for $v is not set"; missing=1; fi
          done
          if [ -z "${{ secrets.APP_STORE_CONNECT_KEY }}" ]; then echo "::error::APP_STORE_CONNECT_KEY is not set"; missing=1; fi
          exit $missing

      - name: Install API key
        env:
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          mkdir -p ~/private_keys
          printf '%s\n' "$KEY_P8" > ~/private_keys/AuthKey_$KEY_ID.p8
          echo "KEY_PATH=$HOME/private_keys/AuthKey_$KEY_ID.p8" >> "$GITHUB_ENV"

      - name: Archive
        run: |
          set -o pipefail
          # Each run gets a fresh, increasing build number; App Store Connect rejects repeats.
          BUILD_NUMBER=$(( ${{ github.run_number }} + 1 ))
          xcodebuild archive \
            -project StellarNavigator.xcodeproj \
            -scheme StellarNavigator \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/StellarNavigator.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Upload to App Store Connect
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/StellarNavigator.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Clean up key
        if: always()
        run: rm -rf ~/private_keys
