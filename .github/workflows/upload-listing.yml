name: Fill in the App Store listing

# Applies appstore/listing.json to the editable App Store version through the App Store
# Connect API (same API key secrets as the TestFlight workflow): name, subtitle, description,
# keywords, promotional text, URLs, copyright, categories, content rights, age rating,
# App Review notes, and the build to submit. App Privacy and the App Review contact details
# have no API and stay manual.

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build to attach (blank = newest processed build)"
        required: false
        default: ""

jobs:
  listing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet "pyjwt[crypto]"
      - name: Apply listing
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          BUNDLE_ID: io.github.stasgold.skyatlas
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: python3 tools/asc_metadata.py
